skillsEnable:
  - code-review
  - codebase-design
  - ponytail
  - ponytail-review
promptsDisable: ["*"]
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  behavioralGuidelines:
    enabled: true
    sections:
      communicationAndToolUse: false
      executionPolicy: false
      evidenceDiscipline: false
      changeScope: false
      validation: false
      finalResponse: false
      planningDiscipline: false
      communicationAndToolUseMinimal: true
      executionPolicyMinimal: true
      evidenceDisciplineMinimal: true
      changeScopeMinimal: true
      validationMinimal: true
      finalResponseMinimal: false
      planningDisciplineMinimal: false
packagesEnable:
  - git:github.com/hiennguyen9874/pi-grep-glob
  - npm:@hiennguyen9874/pi-single-edit
  - npm:pi-subagents-lite
  - npm:pi-observational-memory
packagesDisable:
  - npm:@hiennguyen9874/pi-multi-edit
  - git:github.com/hiennguyen9874/pi-notebook-mode@feat/single-edit-nested-tool
  - npm:@howaboua/pi-codex-conversion
  - git:github.com/hiennguyen9874/pi-ask-user
  - git:github.com/hiennguyen9874/pi-shake
extensionsDisable:
  - ./extensions/disable-project-context.ts
  - ./extensions/system-prompt-appender.ts
  - ./extensions/disable-write-tool.ts
  - ./extensions/disable-read-tool.ts
  - ./extensions/disable-bash-tool.ts
  - ./extensions/disable-edit-tools.ts
extensionsEnable:
  - builtin:codemode
  - builtin:tool-search
extra:
  override:
    extensionState:
      piDocumentationEnabled: false
    defaultTools:
      # - "+find"
      # - "+grep"
      # - "+ls"
      - "+codemode"
    codemode:
      mode: "only"
      inlineBudget": 3000
