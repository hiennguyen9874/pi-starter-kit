skillsEnable:
  - implement
  - tdd
  - diagnosing-bugs
  - pragmatic-principles
  - agent-friendly-code
  - handoff
  - codebase-design
  - domain-modeling
  - code-review
promptsDisable: ['*']
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  behavioralGuidelines:
    enabled: true
    sections:
      communicationAndToolUse: true
      executionPolicy: true
      evidenceDiscipline: true
      changeScope: true
      validation: true
      finalResponse: true
      planningDiscipline: false
packagesEnable:
  - npm:@spences10/pi-confirm-destructive
