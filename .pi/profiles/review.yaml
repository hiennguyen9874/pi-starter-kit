skillsEnable:
  - code-review
  - codebase-design
  - domain-modeling
  - pragmatic-principles
promptsDisable: ['*']
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  behavioralGuidelines:
    enabled: true
    sections:
      communicationAndToolUse: true
      executionPolicy: true
      evidenceDiscipline: true
      changeScope: true
      validation: true
      finalResponse: false
      planningDiscipline: false
packagesEnable:
  - npm:@gotgenes/pi-subagents
packagesDisable:
  - npm:pi-subagents
  - npm:pi-prompt-template-model
  - npm:pi-intercom
  - git:github.com/hiennguyen9874/pi-ask-user
  - git:github.com/hiennguyen9874/pi-shake
extensionsDisable:
  - ./extensions/disable-write-tool.ts
  - ./extensions/disable-read-tool.ts
  - ./extensions/disable-bash-tool.ts
  - ./extensions/disable-edit-tools.ts
extra:
  override:
    defaultProvider: openai-codex
    defaultModel: gpt-5.6-sol
    defaultThinkingLevel: medium
