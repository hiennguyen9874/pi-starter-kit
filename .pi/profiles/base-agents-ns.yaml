skillsEnable: []
skillsDisable:
  - '*'
promptsDisable: ['*']
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  behavioralGuidelines:
    enabled: true
    sections:
      communicationAndToolUse: true
      executionPolicy: true
      evidenceDiscipline: true
      changeScope: true
      validation: true
      finalResponse: true
      planningDiscipline: true
packagesEnable:
