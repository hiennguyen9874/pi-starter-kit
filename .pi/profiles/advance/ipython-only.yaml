# ipython-only: Python-REPL-first agent via pi-ipython.
#
# pi-ipython runs in exclusive mode:
#   - setActiveTools(["ipython"]) on session_start and before every turn, so other tools get hidden.
#   - before_agent_start returns a brand-new system prompt (REPL prompt + AGENTS.md + skills + cwd/date)
#     built from systemPromptOptions; it ignores event.systemPrompt.
# Package extensions load after project-local ones (./extensions/*), so any local extension
# that rewrites the system prompt in before_agent_start gets overwritten. Builtins load last
# and would override ipython (codemode/tool-search), so they are disabled too.
skillsEnable:
  - handoff
  - show-me
  - i-have-adhd
skillsDisable: []
promptsDisable: ["*"]
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  # Injected by the profile extension (local), so it would be overwritten by ipython anyway.
  behavioralGuidelines:
    enabled: false
packagesEnable:
  - git:github.com/hiennguyen9874/pi-ipython
packagesDisable:
  # Tools that ipython would hide anyway.
  - npm:@hiennguyen9874/pi-multi-edit
  - npm:@hiennguyen9874/pi-single-edit
  - git:github.com/hiennguyen9874/pi-grep-glob
  - git:github.com/hiennguyen9874/pi-notebook-mode@feat/single-edit-nested-tool
  - git:github.com/hiennguyen9874/pi-ask-user
  # Also changes the prompt/tools/context.
  - npm:@howaboua/pi-codex-conversion
  - git:github.com/hiennguyen9874/pi-shake
  - npm:pi-observational-memory
extensionsDisable:
  # Builtins load after packages: they would take over tools/prompt from ipython.
  - builtin:codemode
  - builtin:tool-search
  - builtin:mcp
  - ./extensions/codemode-direct-write.ts
  # Rewrites the system prompt before ipython runs, so its changes get thrown away.
  - ./extensions/system-prompt-appender.ts
  - ./extensions/disable-project-context.ts
  - ./extensions/pi-documentation.ts
  - ./extensions/remove-pi-env-guideline.ts
  # Only filters active tools or adds tools: redundant once ipython is exclusive.
  - ./extensions/disable-write-tool.ts
  - ./extensions/disable-read-tool.ts
  - ./extensions/disable-bash-tool.ts
  - ./extensions/disable-edit-tools.ts
  - ./extensions/disable-om-recall-tool.ts
  - ./extensions/enable-ls-tool.ts
  - ./extensions/visual-explainer.ts
  # Only guards the `bash` tool; ipython runs bash() inside Python, so it never fires.
  - ./extensions/permission-gate.ts
extensionsEnable: []
