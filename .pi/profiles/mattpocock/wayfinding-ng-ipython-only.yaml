# IPython variant of wayfinding-ng-cm-only.yaml. See advance/ipython-only.yaml for conflict notes.
# Resolve decision tickets across sessions, then turn the map into a spec and implementation tickets.
skillsEnable:
  - skills/mattpocock/wayfinder
  - skills/mattpocock/grilling
  - skills/mattpocock/domain-modeling
  - skills/mattpocock/prototype
  - skills/mattpocock/research
  - skills/mattpocock/to-spec
  - skills/mattpocock/to-tickets
promptsDisable: ["*"]
mcpServersDisable: ["*"]
extensionState:
  behavioralGuidelines:
    enabled: false
    sections:
      communicationAndToolUse: false
      communicationAndToolUseIpython: true
      executionPolicy: true
      evidenceDiscipline: true
      changeScope: true
      validation: true
      finalResponse: true
      planningDiscipline: true
packagesEnable:
  - git:github.com/hiennguyen9874/pi-ipython
  - git:github.com/hiennguyen9874/pi-ask-user
  - npm:pi-subagents-lite
packagesDisable:
  - npm:@hiennguyen9874/pi-multi-edit
  - npm:pi-observational-memory
  - npm:@gotgenes/pi-subagents
  - npm:pi-subagents
  - npm:pi-prompt-template-model
  - npm:pi-intercom
  - npm:@spences10/pi-confirm-destructive
  - git:github.com/hiennguyen9874/pi-shake
  - git:github.com/hiennguyen9874/pi-grep-glob
  - npm:@hiennguyen9874/pi-single-edit
extensionsDisable:
  - builtin:codemode
  - builtin:tool-search
  - ./extensions/disable-write-tool.ts
  - ./extensions/disable-read-tool.ts
  - ./extensions/disable-bash-tool.ts
  - ./extensions/disable-edit-tools.ts
  - ./extensions/codemode-direct-write.ts
  - ./extensions/enable-ls-tool.ts
  - ./extensions/permission-gate.ts
extensionsEnable: []
