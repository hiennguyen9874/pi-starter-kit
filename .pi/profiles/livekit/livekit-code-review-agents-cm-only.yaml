skillsEnable:
  - code-review
  - codebase-design
  - ponytail
  - ponytail-review
  - building-livekit-agents
  - debugging-livekit-agents
  - operating-livekit-agents
  - reading-livekit-docs
  - running-livekit-simulations
  - testing-livekit-agents
  - writing-livekit-scenarios
skillsDisable: []
promptsDisable: ["*"]
mcpServersEnable: []
mcpServersDisable:
  - exa
  - chrome-devtools
  - context-mode
  - deepwiki
extensionState:
  behavioralGuidelines:
    enabled: true
    sections:
      communicationAndToolUse: true
      executionPolicy: true
      evidenceDiscipline: true
      changeScope: true
      validation: true
      finalResponse: false
      planningDiscipline: false
packagesEnable:
  - npm:pi-subagents-lite
  - git:github.com/hiennguyen9874/pi-grep-glob
  - npm:@hiennguyen9874/pi-single-edit
packagesDisable:
  - npm:@hiennguyen9874/pi-multi-edit
  - npm:@spences10/pi-confirm-destructive
  - git:github.com/hiennguyen9874/pi-ask-user
  - git:github.com/hiennguyen9874/pi-shake
  - npm:pi-observational-memory
extensionsDisable:
  - ./extensions/disable-project-context.ts
  - ./extensions/system-prompt-appender.ts
  - ./extensions/disable-write-tool.ts
  - ./extensions/disable-read-tool.ts
  - ./extensions/disable-bash-tool.ts
  - ./extensions/disable-edit-tools.ts
extensionsEnable:
  - builtin:codemode
  - builtin:tool-search
extra:
  override:
    extensionState:
      piDocumentationEnabled: false
    defaultTools:
      # - "+find"
      # - "+grep"
      # - "+ls"
      - "+codemode"
    codemode:
      mode: "only"
      inlineBudget": 3000
